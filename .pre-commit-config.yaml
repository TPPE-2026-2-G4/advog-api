default_install_hook_types:
  - commit-msg
  - pre-push

repos:
  - repo: local
    hooks:
      - id: commit-msg-check
        name: Valida mensagem de commit (Conventional Commits)
        entry: scripts/hooks/commit-msg.sh
        language: script
        stages: [commit-msg]
        verbose: true

      - id: tests-check
        name: Roda testes com cobertura (pytest --cov-fail-under=95)
        entry: scripts/hooks/pre-push-test.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
