name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pytest Check [Coverage > 95%]
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: advog
      SMTP_PASSWORD: advog
      SMTP_FROM: nao-responda@escritorio.com.br
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --all-groups

      - name: Rodar testes com cobertura
        run: uv run pytest
